<!doctype html><html><head><meta charset="utf-8"><title>340055.swf.zip</title>
<style>html,body{margin:0;background:#1c1c1c;color:#ddd;font-family:sans-serif}
#stage{width:512px;height:512px;position:relative;margin:16px auto;background:repeating-conic-gradient(#333 0% 25%,#2a2a2a 0% 50%) 50%/32px 32px;border:1px solid #555;overflow:hidden}
#stage canvas{position:absolute;background:transparent}
#bar{display:flex;flex-wrap:wrap;gap:4px;max-width:560px;margin:0 auto;justify-content:center}
button{padding:4px 8px;cursor:pointer;background:#333;color:#ddd;border:1px solid #555;border-radius:4px;font-size:12px}
button:hover{background:#456}
#now{text-align:center;margin:8px;font-size:18px}
#empties{text-align:center;margin:6px;font-size:12px;color:#e88;min-height:16px}
button.empty{background:#262626;color:#777;text-decoration:line-through;cursor:help;border-color:#444}
button.empty::after{content:" 空";color:#c66;font-size:10px;margin-left:2px}
</style></head><body>
<div id="now">—</div><div id="empties"></div><div id="stage"><canvas id="cv"></canvas></div>
<div id="bar"><button data-pool="5" data-label="attackRB">attackRB</button>
<button class="empty" data-pool="5" data-label="castLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">castLT</button>
<button data-pool="10" data-label="castRB">castRB</button>
<button class="empty" data-pool="10" data-label="downLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">downLT</button>
<button data-pool="15" data-label="downRB">downRB</button>
<button class="empty" data-pool="15" data-label="standLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">standLT</button>
<button class="empty" data-pool="15" data-label="standLB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">standLB</button>
<button class="empty" data-pool="15" data-label="standRT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">standRT</button>
<button data-pool="20" data-label="standRB">standRB</button>
<button data-pool="25" data-label="walkLT">walkLT</button>
<button class="empty" data-pool="25" data-label="walkLB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">walkLB</button>
<button class="empty" data-pool="25" data-label="walkRT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">walkRT</button>
<button data-pool="30" data-label="walkRB">walkRB</button>
<button class="empty" data-pool="30" data-label="defendLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">defendLT</button>
<button class="empty" data-pool="30" data-label="defendRB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">defendRB</button>
<button class="empty" data-pool="30" data-label="sitLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">sitLT</button>
<button class="empty" data-pool="30" data-label="sitLB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">sitLB</button>
<button class="empty" data-pool="30" data-label="sitRT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">sitRT</button>
<button class="empty" data-pool="30" data-label="sitRB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">sitRB</button>
<button class="empty" data-pool="30" data-label="damageLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">damageLT</button>
<button class="empty" data-pool="30" data-label="damageRB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">damageRB</button>
<button class="empty" data-pool="30" data-label="prepLT" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">prepLT</button>
<button class="empty" data-pool="30" data-label="PrepRB" title="此动画无独立素材：游戏中由水平翻转生成（空方向）">PrepRB</button></div>
<script src="../../../fanvas3-transparent.js"></script><script src="swfData.js"></script>
<script>
const labels=[{"label":"attackRB","pool":5,"roleFrame":3,"empty":false},{"label":"castLT","pool":5,"roleFrame":4,"empty":true},{"label":"castRB","pool":10,"roleFrame":5,"empty":false},{"label":"downLT","pool":10,"roleFrame":6,"empty":true},{"label":"downRB","pool":15,"roleFrame":7,"empty":false},{"label":"standLT","pool":15,"roleFrame":8,"empty":true},{"label":"standLB","pool":15,"roleFrame":9,"empty":true},{"label":"standRT","pool":15,"roleFrame":10,"empty":true},{"label":"standRB","pool":20,"roleFrame":11,"empty":false},{"label":"walkLT","pool":25,"roleFrame":12,"empty":false},{"label":"walkLB","pool":25,"roleFrame":13,"empty":true},{"label":"walkRT","pool":25,"roleFrame":14,"empty":true},{"label":"walkRB","pool":30,"roleFrame":15,"empty":false},{"label":"defendLT","pool":30,"roleFrame":16,"empty":true},{"label":"defendRB","pool":30,"roleFrame":17,"empty":true},{"label":"sitLT","pool":30,"roleFrame":18,"empty":true},{"label":"sitLB","pool":30,"roleFrame":19,"empty":true},{"label":"sitRT","pool":30,"roleFrame":20,"empty":true},{"label":"sitRB","pool":30,"roleFrame":21,"empty":true},{"label":"damageLT","pool":30,"roleFrame":22,"empty":true},{"label":"damageRB","pool":30,"roleFrame":23,"empty":true},{"label":"prepLT","pool":30,"roleFrame":24,"empty":true},{"label":"PrepRB","pool":30,"roleFrame":25,"empty":true}];
const emptySet=new Set(labels.filter(L=>L.empty).map(L=>L.label));
const ec=emptySet.size;
document.getElementById('empties').textContent= ec>0 ? ('⚠ 空动画（'+ec+' 个，翻转生成）：'+[...emptySet].join('、')) : '全部动画均有独立素材';

function mergeRect(a,b){ if(!a) return b; if(!b) return a; const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y); return {x:x,y:y,width:Math.max(a.x+a.width,b.x+b.width)-x,height:Math.max(a.y+a.height,b.y+b.height)-y}; }
function unionRectOf(dp,idx,seen){
  seen=seen||new Set(); if(seen.has(idx)) return null; seen.add(idx);
  const d=dp[idx]; if(!d) return null;
  let r=(d.rect&&(d.rect.width||d.rect.height))?{x:d.rect.x,y:d.rect.y,width:d.rect.width,height:d.rect.height}:null;
  const fal=d.frameActionList;
  if(fal&&Array.isArray(fal)){ for(const kf of fal){ if(!kf) continue; const acts=Array.isArray(kf)?kf.slice(1):[]; for(const a of acts){ if(Array.isArray(a)&&a[0]==='pE'&&a[1]&&a[1].id!=null){ const cr=unionRectOf(dp,a[1].id,seen); if(cr) r=mergeRect(r,cr); } } } }
  const dl=d.displayList||d.frames;
  if(dl&&Array.isArray(dl)){ for(const fr of dl){ if(Array.isArray(fr)){ for(const a of fr){ if(Array.isArray(a)&&a[0]==='pE'&&a[1]&&a[1].id!=null){ const cr=unionRectOf(dp,a[1].id,seen); if(cr) r=mergeRect(r,cr); } } } } }
  return r;
}
function play(pool,label){
  const rd=swfData.definitionPool[pool];
  if(!rd) return;
  // 用真实并集包围盒覆盖存储 rect：动画逐帧切换的 pose 图可能比第 0 帧大，避免被画布裁切
  const ur=unionRectOf(swfData.definitionPool,pool);
  if(ur&&ur.width>0&&ur.height>0) rd.rect=ur;
  const rect=rd.rect;
  // 过大模型缩放到 512 舞台内（留出边距），避免溢出被 overflow:hidden 裁掉
  const sc=Math.min(1, 490/(rect.width||1), 470/(rect.height||1));
  const stage=document.getElementById('stage'); const old=document.getElementById('cv');
  if(old){try{fanvas.pause(old);}catch(e){} old.remove();}
  const cv=document.createElement('canvas'); cv.id='cv'; stage.appendChild(cv);
  cv.style.position='absolute';
  // 脚底锚定：脚(并集底边中心)固定在 (256,455)，身体向上 —— 与游戏 fighter 脚底原点约定一致
  cv.style.left=(256-(rect.width/2)*sc)+'px';
  cv.style.top=(455-rect.height*sc)+'px';
  cv.style.transform='none';
  const note=emptySet&&emptySet.has(label)?'   ⚠ 此动画无独立素材：游戏中由水平翻转生成（空方向）':'';
  document.getElementById('now').textContent=label+'  (rootDef='+pool+')  [模型真实包围盒·脚底锚定·512舞台]'+note;
  fanvas.play(cv,swfData,{rootDef:pool,transparent:true,cache:1,scale:sc,imagePath:'images/',autoPlay:true});
}
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>play(+b.dataset.pool,b.dataset.label));
if(labels.length) play(labels[0].pool, labels[0].label);
</script></body></html>
